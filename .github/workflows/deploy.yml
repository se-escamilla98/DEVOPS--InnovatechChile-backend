name: Backend CI/CD Pipeline - EP3

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y Push imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --no-cache \
            -t $ECR_REGISTRY/innovatech-backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/innovatech-backend:latest \
            .
          docker push $ECR_REGISTRY/innovatech-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/innovatech-backend:latest
          echo "Imagen publicada: $ECR_REGISTRY/innovatech-backend:$IMAGE_TAG"

      - name: Deploy en ECS
        run: |
          aws ecs update-service \
            --cluster innovatech-cluster \
            --service backend-service \
            --force-new-deployment \
            --region us-east-1
          echo "Deploy iniciado en ECS Fargate"
